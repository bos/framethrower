name: FrameThrower
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: '15.0'
  xcodeVersion: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    WARN_SWIFT3_OBJC_INFERENCE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_CONCISE_MAGIC_FILE: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_GLOBAL_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_IMPLICIT_OPEN_EXISTENTIALS: YES
    SWIFT_UPCOMING_FEATURE_ISOLATED_DEFAULT_VALUES: YES
    SWIFT_UPCOMING_FEATURE_REGION_BASED_ISOLATION: YES
    SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_BARE_SLASH_REGEX_LITERALS: YES
    SWIFT_UPCOMING_FEATURE_FORWARD_TRAILING_CLOSURES: YES
    SWIFT_UPCOMING_FEATURE_IMPORT_OBJC_FORWARD_DECLARATIONS: YES
    SWIFT_UPCOMING_FEATURE_DISABLE_OUTWARD_ACTOR_ISOLATION: YES
    SWIFT_UPCOMING_FEATURE_CONSUMING_ARGUMENTS: YES
    MARKETING_VERSION: "0.1.7"
    CURRENT_PROJECT_VERSION: "8"
    INFOPLIST_KEY_CFBundleVersion: "8"
    INFOPLIST_KEY_CFBundleShortVersionString: "0.1.7"

configs:
  Debug: debug
  Release: release

targets:
  FrameThrower:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        type: folder
      - path: ../Tools/director-cli-client.py
        buildPhase: resources
      - path: ../Tools/framethrower-mcp.py
        buildPhase: resources
      - path: ../Tools/director-agent-client.py
        buildPhase: resources
      - path: ../Tools/DirectorAgents
        type: folder
        buildPhase: resources
    entitlements:
      path: Resources/FrameThrower.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: FrameThrower
        CFBundleName: FrameThrower
        CFBundleIconFile: Resources/FrameThrower.icns
        NSCameraUsageDescription: FrameThrower records your selected camera as an editable picture-in-picture track.
        NSCameraUseContinuityCameraType: true
        NSMicrophoneUsageDescription: FrameThrower uses your microphone for recording audio and on-device editing instructions.
        CFBundleShortVersionString: "0.1.7"
        CFBundleVersion: "8"
        CFBundleURLTypes:
          - CFBundleURLName: "Slack OAuth"
            CFBundleURLSchemes:
              - "screencast-slack"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.screencast
        PRODUCT_NAME: FrameThrower
        DEVELOPMENT_TEAM: P7EW9T546Z
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: '15.0'
    postBuildScripts:
      - name: Bundle local OAuth configuration
        script: 'python3 "$SRCROOT/../Tools/embed-oauth-config.py" --env "$SRCROOT/../.env" --output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/OAuthConfig.plist"'
        inputFiles:
          - $(SRCROOT)/../Tools/embed-oauth-config.py
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/OAuthConfig.plist
        basedOnDependencyAnalysis: false
      - name: Bundle local Metal speech runtime
        script: '"$SRCROOT/../Tools/build-local-speech-runtime.sh" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/LocalSpeech"'
        inputFiles:
          - $(SRCROOT)/../Tools/build-local-speech-runtime.sh
          - $(SRCROOT)/../Tools/LocalSpeech/main.cpp
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/LocalSpeech/FrameThrowerSpeech
        basedOnDependencyAnalysis: true
    dependencies: []
